name: Poll attendee lists

# Fetches each active attendee list, stamps arrivals and departures into site/data/, and
# commits only when something actually changed. That commit is what deploys the site --
# deploy-pages.yml triggers on pushes to main that touch site/.
#
# `added_at` precision is bounded by this schedule: at */30 a new attendee is recorded
# within 30 minutes of appearing. Tighten the cron to tighten the stamp. GitHub's scheduler
# is best-effort and runs late under load, so treat the interval as an upper bound rather
# than a guarantee.
#
# Repository secrets (all optional -- without them the poll still runs, it just does not
# email): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM, SMTP_TO
#
# Manual runs accept a `force` input, which bypasses the roster-drop guard. Use it only
# when a large drop is genuine; the guard exists because a truncated response would
# mass-depart the roster and destroy every added_at on the next recovery.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the roster-drop guard (only for a genuine mass departure)"
        type: boolean
        default: false
      dry_run:
        description: "Report only -- write nothing, send nothing"
        type: boolean
        default: false

concurrency:
  group: poll-attendees
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Poll
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/poll.js $ARGS

      - name: Commit any change
        id: commit
        run: |
          set -euo pipefail

          # The poller writes only when the data actually differs, so an empty diff here
          # is the normal case for most of the day -- not a failure.
          if git diff --quiet -- site/data; then
            echo "No attendee changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data

          SUMMARY=$(git diff --cached --stat | tail -n 1)
          git commit -m "TSK: Data - update attendee snapshot" -m "$SUMMARY"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Publishing has to be chained rather than left to deploy-site.yml's push trigger: the
  # commit above is made with GITHUB_TOKEN, and GitHub does not start workflow runs from
  # those pushes. Without this the data would update and the site would never redeploy.
  deploy:
    needs: poll
    if: needs.poll.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-site.yml
    secrets: inherit
