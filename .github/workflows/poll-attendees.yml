name: Poll attendee lists

# Fetches each active attendee list, stamps arrivals and departures into site/data/, and
# commits only when something actually changed. When it does commit, it calls deploy-site.yml
# directly -- see the deploy job at the bottom for why the push trigger cannot be relied on.
#
# `added_at` precision is bounded by this schedule PLUS GitHub's scheduling lag, and the lag
# is the larger term. Scheduled workflows are best-effort: they queue behind on-demand runs
# and get dropped under load. Measured on this repo, one run landed 28 minutes late and the
# two slots after it were skipped entirely -- so the honest resolution is about an hour.
#
# Shortening the cron does not fix that; GitHub drops the extra slots too. If the stamp ever
# needs to be tight, trigger this workflow from a scheduler that keeps time -- a Cloudflare
# Worker Cron Trigger calling the workflow-dispatch API -- since dispatched runs start
# promptly. That needs a GitHub PAT as a Worker secret, hence not the default.
#
# Repository secrets (all optional -- without them the poll still runs, it just does not
# email): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, SMTP_FROM, SMTP_TO
#
# Manual runs accept a `force` input, which bypasses the roster-drop guard. Use it only
# when a large drop is genuine; the guard exists because a truncated response would
# mass-depart the roster and destroy every added_at on the next recovery.

on:
  schedule:
    # Deliberately NOT "*/30", which lands on :00 -- the busiest minute on GitHub's
    # scheduler, where runs are most often delayed or dropped outright. Scheduled
    # workflows are best-effort and get queued behind on-demand runs, so an odd offset
    # measurably improves the odds of firing near the requested time.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the roster-drop guard (only for a genuine mass departure)"
        type: boolean
        default: false
      dry_run:
        description: "Report only -- write nothing, send nothing"
        type: boolean
        default: false

concurrency:
  group: poll-attendees
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Poll
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/poll.js $ARGS

      - name: Commit any change
        id: commit
        run: |
          set -euo pipefail

          # The poller writes only when the data actually differs, so an empty diff here
          # is the normal case for most of the day -- not a failure.
          if git diff --quiet -- site/data; then
            echo "No attendee changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data

          SUMMARY=$(git diff --cached --stat | tail -n 1)
          git commit -m "TSK: Data - update attendee snapshot" -m "$SUMMARY"
          git push

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Publishing has to be chained rather than left to deploy-site.yml's push trigger: the
  # commit above is made with GITHUB_TOKEN, and GitHub does not start workflow runs from
  # those pushes. Without this the data would update and the site would never redeploy.
  #
  # The commit SHA is passed explicitly. Without it the deploy checks out github.sha, which
  # is the commit that STARTED this run -- i.e. the tree from before the poller committed --
  # and republishes stale data while reporting success.
  deploy:
    needs: poll
    if: needs.poll.outputs.changed == 'true'
    uses: ./.github/workflows/deploy-site.yml
    with:
      ref: ${{ needs.poll.outputs.sha }}
    secrets: inherit
